<!DOCTYPE html><html><head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
</head><body style="margin:0;background:#888">
<canvas id="c"></canvas>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const doc = await pdfjsLib.getDocument('file:///c:/Users/tamim/Downloads/whatsapp/130726100.pdf').promise;
const page = await doc.getPage(1);
const scale = 4;
const viewport = page.getViewport({ scale });
const canvas = document.getElementById('c');
canvas.width = viewport.width; canvas.height = viewport.height;
const ctx = canvas.getContext('2d');
ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
await page.render({ canvasContext: ctx, viewport }).promise;
document.title = 'RENDERED';
window.__dims = { w: canvas.width, h: canvas.height };
</script></body></html>
